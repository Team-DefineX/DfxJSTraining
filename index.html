<body>
  <header class="header"></header>
  <main class="main">
    <h1 class="visually-hidden">DefineX JS Training</h1>
    <div class="responsive-wrapper">
      <div class="content">
        <div class="content-panel">
          <div class="flex-shrink-0 p-3" style="width: 280px">
            <a href="/"
              class="d-flex align-items-center pb-3 mb-3 link-body-emphasis text-decoration-none border-bottom">

            </a>
            <div id="sidebar"></div>
          </div>
        </div>
        <div class="content-main">
          <div class="card-grid">
            <article class="card">
              <div class="card-header text-bg-primary">
                <div>
                  <h3 class="title"><b>Ders Adı</b></h3>
                  <span class="mins">360 mins</span>
                </div>
              </div>
              <div class="card-body">
                <h5 class="card-title text-primary">Alt Başlık</h5>
                <div class="card-text">
                  Welcome to Our JavaScript Education. Today we will see some
                  example of javascript usages
                  <ul>
                    <li>What is the Dom and how it works?</li>
                    <li>BOM Usages & examples</li>
                    <li>Objects</li>
                    <li>Arrays</li>
                    <li>ES5 ES6, ..., ES13</li>
                  </ul>
                </div>
              </div>
              <div class="card-footer text-body-secondary">
                <a href="#" onclick="nextStep()" id="nextButton">Next</a>
              </div>
            </article>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/dist/js/bootstrap.bundle.min.js"></script>

  <script src="resources/sidebars.js"></script>

  <script src="resources/prism.js"></script>

  <script></script>

  <script type="module">
    import { modules } from './resources/moduleData.js';

    let currentModuleIndex = 0;
    let currentStepIndex = 0;
    let selectedStepIndex = null;


    function createSidebar(sidebarData) {
      const sidebar = document.createElement('ul');
      sidebar.classList.add('btn-toggle-nav', 'list-unstyled', 'fw-normal', 'pb-1', 'small');
      sidebarData.forEach((module, moduleIndex) => {
        const moduleItem = document.createElement('li');
        moduleItem.classList.add('mb-1');
        const button = document.createElement('button');
        button.classList.add('btn', 'btn-toggle', 'd-inline-flex', 'align-items-center', 'rounded', 'border-0',
          'collapsed');
        button.setAttribute('data-bs-toggle', 'collapse');
        button.setAttribute('data-bs-target', `#${module.fileName}-collapse`);
        button.setAttribute('aria-expanded', 'false');
        button.textContent = module.moduleName;
        const collapseDiv = document.createElement('div');
        collapseDiv.classList.add('collapse');
        collapseDiv.id = `${module.fileName}-collapse`;
        const collapseList = document.createElement('ul');
        collapseList.classList.add('btn-toggle-nav', 'list-unstyled', 'fw-normal', 'pb-1', 'small');
        module.steps.forEach((step, index) => {
          const stepItem = document.createElement('li');
          const link = document.createElement('a');
          link.href = '#';
          link.classList.add('link-body-emphasis', 'd-inline-flex', 'text-decoration-none', 'rounded');
          link.textContent = step.name;
          link.onclick = () => goToStep(moduleIndex, index);
          stepItem.appendChild(link);
          collapseList.appendChild(stepItem);
        });
        collapseDiv.appendChild(collapseList);
        moduleItem.appendChild(button);
        moduleItem.appendChild(collapseDiv);
        sidebar.appendChild(moduleItem);
      });
      return sidebar;
    }

    const sidebar = document.getElementById('sidebar');

    const visibleModules = modules.filter(module => module.visible);

    const prepateSlider = createSidebar(visibleModules);
    sidebar.appendChild(prepateSlider);

    const resultPage = {
      folder: "Result",
      page: "result",
      title: "Result",
      subtitle: "Congratulations, you have completed all the steps!",
      min: "0mins",
    };

    function renderStep(moduleIndex, stepIndex) {
      const module = modules[moduleIndex];
      const step = module.steps[stepIndex];
      document.getElementById("nextButton").style.display = "flex";
      render(
        module.fileName,
        `step${stepIndex + 1}`,
        module.moduleName,
        step.name,
        step.time
      );
    }

    window.nextStep = function () {
      if (selectedStepIndex !== null) {
        ++selectedStepIndex;
        if (
          selectedStepIndex <=
          modules[currentModuleIndex].steps.length - 1
        ) {
          renderStep(currentModuleIndex, selectedStepIndex);
        } else {
          render(
            resultPage.folder,
            resultPage.page,
            resultPage.title,
            resultPage.subtitle,
            resultPage.min
          );
          document.getElementById("nextButton").style.display = "none";
        }
      } else {
        if (
          currentStepIndex <=
          modules[currentModuleIndex].steps.length - 1
        ) {
          renderStep(currentModuleIndex, currentStepIndex);
          currentStepIndex++;
        } else {
          render(
            resultPage.folder,
            resultPage.page,
            resultPage.title,
            resultPage.subtitle,
            resultPage.min
          );
          document.getElementById("nextButton").style.display = "none";
        }
      }
    }

    function goToStep(moduleIndex, stepIndex) {
      currentModuleIndex = moduleIndex;
      selectedStepIndex = stepIndex;
      renderStep(currentModuleIndex, selectedStepIndex);
    }

    function toggleSolution() {
      var solution = this.nextElementSibling;
      if (solution.classList.contains("hidden")) {
        solution.classList.remove("hidden");
      } else {
        solution.classList.add("hidden");
      }
    }

    function load(url, element) {
      //document.getElementsByClassName("card-text").innerHTML='<object type="text/html" data="' + url + '" ></object>';
      fetch(url)
        .then((response) => response.text())
        .then((text) => (element.innerHTML = text));
    }

    let promise = new Promise((resolve, reject) => {
      setTimeout(() => resolve("done!"), 500);
    });

    document.addEventListener("DOMContentLoaded", async () => {
      await promise;
      load("./_layouts/header.html", document.querySelector(".header"));
    });

    function render(folder, page, title, subtitle, min, e) {
      document.querySelector(".title").innerHTML = title;
      document.querySelector(".card-title").innerHTML = subtitle;
      document.querySelector(".mins").innerHTML = min;
      let cardText = document.querySelector(".card-text");
      cardText.innerHTML = "";
      let xhr = new XMLHttpRequest();
      xhr.onreadystatechange = function () {
        if (xhr.readyState === XMLHttpRequest.DONE) {
          if (xhr.status === 200) {
            cardText.innerHTML = xhr.responseText;
            var solutionButtons =
              document.getElementsByClassName("solution-btn");
            if (solutionButtons.length) {
              var solutions = document.getElementsByClassName("solution");
              for (var i = 0; i < solutionButtons.length; i++) {
                solutionButtons[i].addEventListener("click", toggleSolution);
              }
              for (var j = 0; j < solutions.length; j++) {
                solutions[j].classList.add("hidden");
              }
            }
            hljs.highlightAll();
          } else {
            cardText.innerHTML = "<p>Bir hata oluştu.</p>";
          }
        }
      };
      xhr.open("GET", "./_includes/" + folder + "/" + page + ".html", true);
      xhr.send();
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

  <script>
    hljs.highlightAll();
  </script>
